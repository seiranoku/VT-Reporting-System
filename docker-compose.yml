services:
  postgres:
    image: postgres:16-alpine
    container_name: vt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vt_db}
      POSTGRES_USER: ${POSTGRES_USER:-vt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vt_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vt_user} -d ${POSTGRES_DB:-vt_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vt-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vt_user}:${POSTGRES_PASSWORD:-vt_password}@postgres:5432/${POSTGRES_DB:-vt_db}
      BACKEND_PORT: 3001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      STORAGE_PATH: /storage/evidence
    ports:
      - "3001:3001"
    volumes:
      - evidence_data:/storage/evidence
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: vt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_data:
